<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de RPG — Jogadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Stylesheets -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/crt-effects.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css?v=8">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/player.css?v=9">
</head>
<body>
<div id="entryOverlay" class="modal-overlay open">
  <div class="modal-dialog">
    <h3>Entrar na mesa</h3>
    <div class="hint hint-m0">&gt; Peça ao mestre o código da mesa.</div>
    <div class="field">
      <label for="entryNameInput">Nome do seu personagem</label>
      <input type="text" id="entryNameInput" placeholder="Ex: Aragorn" maxlength="40">
    </div>
    <div class="field">
      <label for="entryCodeInput">Código da mesa</label>
      <input type="text" id="entryCodeInput" class="room-code-input" placeholder="ABC12"
             maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <div id="entryModeScan" class="hidden">
        <video id="entryScanVideo" playsinline muted></video>
      </div>
      <div class="hint hint-m0" id="entryScanHint"></div>
    </div>
    <div class="field">
      <label for="entryPinInput">PIN da mesa</label>
      <input type="text" id="entryPinInput" class="room-pin-input" placeholder="0000"
             maxlength="4" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <div id="entryActions">
      <button type="button" class="secondary" id="entryModeScanBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        <span>Escanear QR</span>
      </button>
      <button type="button" id="entryJoinBtn">Entrar</button>
    </div>
    <div id="entryStatus" class="hint hint-m0"></div>
  </div>
</div>

<div id="viewport" class="hidden">
  <canvas id="canvas"></canvas>
  <div id="status">Aguardando conexão com o mestre…</div>
  <div id="combatBar">
    <div id="combatBar-track">
      <div id="combatBar-tokens"></div>
    </div>
  </div>
</div>

<!-- Vendor (não usam ES modules) -->
<script src="js/vendor/qrcode.min.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/vendor/jsQR.js"></script>

<!-- Ponto de entrada do Jogador: importa todos os módulos na ordem correta -->
<script type="module" src="js/player/main.js"></script>

</body>
</html>
