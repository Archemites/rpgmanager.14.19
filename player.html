<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de RPG — Jogadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Stylesheets -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/crt-effects.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css?v=7">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/player.css?v=7">
</head>
<body>
<div id="entryOverlay" class="modal-overlay open">
  <div class="modal-dialog">
    <h3>Entrar na mesa</h3>
    <div class="hint hint-m0">&gt; Peça ao mestre o código da mesa.</div>
    <div class="field">
      <label for="entryNameInput">Nome do seu personagem</label>
      <input type="text" id="entryNameInput" placeholder="Ex: Aragorn" maxlength="40">
    </div>
    <div class="field">
      <label for="entryCodeInput">Código da mesa</label>
      <input type="text" id="entryCodeInput" class="room-code-input" placeholder="ABC12"
             maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <div id="entryModeScan" class="hidden">
        <video id="entryScanVideo" playsinline muted></video>
      </div>
      <div class="hint hint-m0" id="entryScanHint"></div>
    </div>
    <div id="entryActions">
      <button type="button" class="secondary" id="entryModeScanBtn">📷 Escanear QR</button>
      <button type="button" id="entryJoinBtn">Entrar</button>
    </div>
    <div id="entryStatus" class="hint hint-m0"></div>
  </div>
</div>

<div id="viewport" class="hidden">
  <canvas id="canvas"></canvas>
  <div id="status">Aguardando conexão com o mestre…</div>
  <div id="combatBar">
    <div id="combatBar-track">
      <div id="combatBar-tokens"></div>
    </div>
  </div>
</div>

<!-- Shared modules (both windows) -->
<script src="js/vendor/qrcode.min.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/vendor/jsQR.js"></script>
<script src="js/shared/webrtc.js?v=7"></script>
<script src="js/shared/camera.js"></script>
<script src="js/shared/photo-cache.js"></script>
<script src="js/shared/object-cache.js"></script>
<script src="js/shared/bars.js"></script>
<script src="js/shared/scene-render.js?v=8"></script>
<script src="js/shared/fx-trail.js"></script>

<!-- Player modules -->
<script src="js/player/state.js?v=10"></script>
<script src="js/player/combat.js"></script>
<script src="js/player/draw.js?v=9"></script>
<script src="js/player/fullscreen.js?v=7"></script>
<script src="js/player/sync.js?v=9"></script>

</body>
</html>
