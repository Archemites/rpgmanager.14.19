<div class="login-wrapper">
  <div id="loginCard" class="modal-dialog">
    <div>
      <h1>MESA://RPG v0.1</h1>
      <div class="hint hint-m0">&gt; Selecione seu papel para entrar na mesa.</div>
    </div>
    <div id="roleButtons">
      <button type="button" id="roleMasterBtn" (click)="goToMaster()" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12,2 21,7.5 21,16.5 12,22 3,16.5 3,7.5" fill="currentColor" fill-opacity="0.15" />
          <polygon points="12,7.5 18,17 6,17" fill="currentColor" fill-opacity="0.25" />
          <line x1="12" y1="2" x2="12" y2="7.5" />
          <line x1="21" y1="7.5" x2="18" y2="17" />
          <line x1="21" y1="16.5" x2="18" y2="17" />
          <line x1="12" y1="22" x2="18" y2="17" />
          <line x1="12" y1="22" x2="6" y2="17" />
          <line x1="3" y1="16.5" x2="6" y2="17" />
          <line x1="3" y1="7.5" x2="6" y2="17" />
          <line x1="12" y1="7.5" x2="21" y2="7.5" />
          <line x1="12" y1="7.5" x2="3" y2="7.5" />
        </svg>
        <span>Sou o Mestre</span>
      </button>
      <button type="button" class="secondary" id="rolePlayerBtn" (click)="goToPlayer()" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor" fill-opacity="0.1" />
          <path d="M9 12l2 2 4-4" />
        </svg>
        <span>Sou Jogador</span>
      </button>
    </div>
  </div>
</div>
