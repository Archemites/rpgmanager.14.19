<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de RPG — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Stylesheets -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/crt-effects.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/modals.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  #loginCard {
    width: 100%;
    max-width: 380px;
    margin: 24px;
  }
  #loginCard h1 {
    margin: 0 0 4px;
    font-size: 20px;
    text-transform: var(--text-transform);
    letter-spacing: var(--head-letter-spacing);
    text-shadow: var(--glow-strong);
  }
  #roleButtons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #roleButtons button { width: 100%; padding: 14px; font-size: 15px; }
</style>
</head>
<body>
<div id="loginCard" class="modal-dialog">
  <div>
    <h1>MESA://RPG v0.1</h1>
    <div class="hint hint-m0">&gt; Selecione seu papel para entrar na mesa.</div>
  </div>
  <div id="roleButtons">
    <button type="button" id="roleMasterBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12,2 21,7.5 21,16.5 12,22 3,16.5 3,7.5" fill="currentColor" fill-opacity="0.15" />
        <polygon points="12,7.5 18,17 6,17" fill="currentColor" fill-opacity="0.25" />
        <line x1="12" y1="2" x2="12" y2="7.5" /><line x1="21" y1="7.5" x2="18" y2="17" /><line x1="21" y1="16.5" x2="18" y2="17" /><line x1="12" y1="22" x2="18" y2="17" /><line x1="12" y1="22" x2="6" y2="17" /><line x1="3" y1="16.5" x2="6" y2="17" /><line x1="3" y1="7.5" x2="6" y2="17" /><line x1="12" y1="7.5" x2="21" y2="7.5" /><line x1="12" y1="7.5" x2="3" y2="7.5" />
      </svg>
      <span>Sou o Mestre</span>
    </button>
    <button type="button" class="secondary" id="rolePlayerBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor" fill-opacity="0.1" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      <span>Sou Jogador</span>
    </button>
  </div>
</div>
<script>
  document.getElementById('roleMasterBtn').addEventListener('click', () => {
    window.location.href = 'master.html';
  });
  document.getElementById('rolePlayerBtn').addEventListener('click', () => {
    window.location.href = 'player.html';
  });
</script>
</body>
</html>
